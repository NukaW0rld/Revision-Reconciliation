[project]
name = "delta-preservation"
version = "0.1.0"
description = "Prototype for preserving inspection characteristic identity across drawing revisions"
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
    "pymupdf",
    "openpyxl",
    "opencv-python",
    "numpy",
    "rapidfuzz",
    "pydantic>=2.5,<3.0",
    "pytest>=8,<9",
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "sqlalchemy",
    "pwdlib[bcrypt]",
    "bcrypt>=4.0.0,<5.0.0",
    "itsdangerous",
]

[tool.setuptools]
packages = ["delta_preservation", "shop", "shop.middleware", "shop.services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]

version: "3.9"
services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    user: "1000:1000"
    ports:
      - "8000:8000"
    volumes:
      # Persistent data: mount directory (not file) so Docker doesn't create shop.db as a dir
      - ../data:/app/data
      - ../out:/app/out
      # Ground truth fixtures for evaluation (read-only)
      - ../assets:/app/assets:ro
    environment:
      # Default admin credentials — CHANGE IN PRODUCTION via .env or env override
      ADMIN_EMAIL: admin@shop.local
      ADMIN_DEFAULT_PASSWORD: changeme
      # SQLite database path (must match volume mount)
      DATABASE_URL: sqlite:////app/data/shop.db
      # Huey task queue SQLite path (same volume as main DB)
      HUEY_DB: /app/data/huey.db
      # Pipeline output directory (mounted volume)
      OUT_DIR: /app/out
      # File upload storage (inside persistent data volume)
      UPLOADS_DIR: /app/data/uploads
    restart: unless-stopped

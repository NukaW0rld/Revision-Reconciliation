<div id="progress-bar" class="flex gap-5 items-center">
  <span class="font-mono text-sm text-base-content/60">{{ pending }} pending</span>
  <span class="font-mono text-sm text-success">{{ approved }} approved</span>
  <span class="font-mono text-sm text-warning">{{ overridden }} overridden</span>
  <span class="font-mono text-xs text-base-content/40">/ {{ total }} total</span>
</div>

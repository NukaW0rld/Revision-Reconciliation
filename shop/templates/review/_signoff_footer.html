<div id="signoff-footer" class="sticky bottom-0 bg-base-200 border-t border-base-300 p-4 flex items-center justify-between">
  <div>
    {% if pending > 0 %}
      <p class="text-sm text-base-content/60">{{ pending }} item{{ 's' if pending != 1 else '' }} remaining</p>
    {% else %}
      <p class="text-sm text-success font-medium">All items resolved — ready to sign off</p>
    {% endif %}
  </div>
  {% if pending == 0 and run.status == 'reviewing' %}
    <!-- Enabled: open confirmation modal -->
    <button class="btn btn-primary" onclick="document.getElementById('signoff-modal').showModal()">
      Sign Off
    </button>
  {% else %}
    <!-- Disabled: show remaining count -->
    <button class="btn btn-primary btn-disabled" disabled>
      Sign Off{% if pending > 0 %} ({{ pending }} pending){% endif %}
    </button>
  {% endif %}
</div>

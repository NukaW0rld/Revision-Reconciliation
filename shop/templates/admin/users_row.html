{% if error %}
<tr><td colspan="5"><div class="alert alert-error">{{ error }}</div></td></tr>
{% else %}
<tr id="user-{{ user.id }}">
    <td>{{ user.email }}</td>
    <td><span class="badge {% if user.role == 'admin' %}badge-primary{% else %}badge-neutral{% endif %}">{{ user.role }}</span></td>
    <td><span class="badge {% if user.is_active %}badge-success{% else %}badge-error{% endif %}">{% if user.is_active %}Active{% else %}Inactive{% endif %}</span></td>
    <td>{{ user.created_at.strftime('%Y-%m-%d') }}</td>
    <td>
        {% if user.role == 'engineer' and user.is_active %}
        <button class="btn btn-xs btn-warning"
            hx-post="/admin/users/{{ user.id }}/deactivate"
            hx-target="closest tr"
            hx-swap="outerHTML"
            hx-confirm="Deactivate {{ user.email }}?">
            Deactivate
        </button>
        {% endif %}
    </td>
</tr>
{% endif %}

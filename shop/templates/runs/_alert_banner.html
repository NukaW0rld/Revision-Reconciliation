<!-- Dismissible alert banner for a single RunAlert -->
<div id="alert-banner-{{ alert.id }}" class="alert alert-error shadow-sm mb-2">
  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
    <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
  </svg>
  <div class="flex-1">
    <p class="font-bold">Run {{ alert.run.part_number }} (Run #{{ alert.run_id }}) failed</p>
    <p class="text-sm">Stage: {{ alert.failure_stage or "Unknown" }}</p>
    <a href="/runs/{{ alert.run_id }}" class="link text-sm">View run details</a>
  </div>
  <button
    hx-post="/alerts/dismiss/{{ alert.id }}"
    hx-target="#alert-banner-{{ alert.id }}"
    hx-swap="outerHTML"
    class="btn btn-ghost btn-xs">
    Dismiss
  </button>
</div>

<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Delta Preservation{% endblock %}</title>
    <link rel="stylesheet" href="/static/dist/output.css">
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/htmx-sse.js"></script>
</head>
<body class="min-h-screen bg-base-200">
    {% block nav %}
    <div class="navbar bg-base-100 shadow-sm sticky top-0 z-50">
      <div class="navbar-start">
        <a href="/dashboard" class="text-lg font-bold px-4">{{ shop_name | default("Delta Preservation") }}</a>
      </div>
      <div class="navbar-end gap-2 pr-4">
        {% if user %}
          <a href="/runs/new" class="btn btn-primary btn-sm">New Run</a>
          <a href="/runs" class="btn btn-ghost btn-sm">My Runs</a>
          <!-- Alert bell -->
          <div class="indicator">
            <a href="/alerts" class="btn btn-ghost btn-sm btn-circle">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-2.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
              </svg>
            </a>
            {% if unread_alert_count and unread_alert_count > 0 %}
            <span class="badge badge-error badge-xs indicator-item">{{ unread_alert_count }}</span>
            {% endif %}
          </div>
          <span class="text-sm text-base-content/70">{{ user.email }}</span>
          <form method="post" action="/logout">
            <button type="submit" class="btn btn-outline btn-xs">Log out</button>
          </form>
        {% endif %}
      </div>
    </div>
    {% endblock %}
    <div id="main-content" class="container mx-auto p-6">
        {% block content %}{% endblock %}
    </div>
</body>
</html>

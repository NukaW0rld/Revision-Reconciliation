{% extends "_base_standalone.html" %}
{% block title %}Sign In — Delta Preservation{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-base-100 px-6 py-12">
  <div class="w-full max-w-sm">

    {# App identity #}
    <div class="mb-10">
      <h1 class="font-mono text-3xl font-bold tracking-tight text-base-content mb-1">
        DELTA<span class="text-primary">.</span>PRES
      </h1>
      <p class="text-base-content/50 text-sm font-mono tracking-widest uppercase">Preservation System</p>
    </div>

    {# Error alert #}
    {% if error %}
    <div class="border-l-4 border-error bg-base-300 p-3 flex items-center gap-3 font-mono text-sm mb-6">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0 text-error" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
      </svg>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    {# Login form #}
    <form method="post" action="/login" class="space-y-0">

      <div class="form-control">
        <label class="label pb-1">
          <span class="label-text font-mono text-xs tracking-widest uppercase text-base-content/60">Username</span>
        </label>
        <input
          type="text"
          name="username"
          class="input input-bordered w-full bg-base-200 font-mono text-sm focus:border-primary focus:outline-none"
          required
          autofocus
          autocomplete="username"
        >
      </div>

      <div class="form-control mt-4">
        <label class="label pb-1">
          <span class="label-text font-mono text-xs tracking-widest uppercase text-base-content/60">Password</span>
        </label>
        <input
          type="password"
          name="password"
          class="input input-bordered w-full bg-base-200 font-mono text-sm focus:border-primary focus:outline-none"
          required
          autocomplete="current-password"
        >
      </div>

      <div class="mt-8">
        <button type="submit" class="btn btn-primary w-full font-mono tracking-widest uppercase text-sm">
          Authenticate
        </button>
      </div>

    </form>

  </div>
</div>
{% endblock %}

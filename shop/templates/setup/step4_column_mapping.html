{% extends "setup/wizard_layout.html" %}
{% block step_content %}
<h2 class="text-xl font-bold mb-2">Step 4: Form 3 Column Mapping</h2>
<p class="text-sm text-base-content/70 mb-4">
    Upload a sample Form 3 Excel file. Columns will be auto-detected based on header names.
    Review the mapping and correct any mismatches before saving.
</p>

<form hx-post="/setup/step4/upload"
      hx-target="#mapping-container"
      hx-swap="innerHTML"
      hx-encoding="multipart/form-data"
      class="mb-4">
    <div class="form-control mb-3">
        <label class="label">
            <span class="label-text font-medium">Sample Form 3 Excel File</span>
        </label>
        <input type="file" name="file" accept=".xlsx,.xls"
               class="file-input file-input-bordered w-full" required>
    </div>
    <button type="submit" class="btn btn-outline btn-sm">Upload and Preview</button>
</form>

<div id="mapping-container" class="mt-4">
    <!-- HTMX will swap the mapping partial or error partial here after upload -->
</div>
{% endblock %}

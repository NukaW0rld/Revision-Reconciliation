{% extends "setup/wizard_layout.html" %}
{% block step_content %}
<h2 class="text-xl font-bold font-mono mb-4">Step 2: Set Admin Password</h2>
<p class="text-sm text-base-content/70 font-mono mb-4">The default password must be changed before proceeding.</p>
{% if admin_email %}
<div class="border-l-4 border-info bg-base-300 p-3 flex items-center gap-3 font-mono text-sm mb-4">
  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0 text-info" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
  </svg>
  <span>Admin login email: <strong>{{ admin_email }}</strong> — save this, you'll need it to log in.</span>
</div>
{% endif %}
<form method="post" action="/setup/step2">
    <div class="form-control mb-3">
        <label class="label"><span class="label-text font-mono text-xs tracking-widest uppercase text-base-content/60">New Password</span></label>
        <input type="password" name="new_password"
               class="input input-bordered bg-base-200 font-mono text-sm focus:border-primary focus:outline-none"
               required minlength="8">
    </div>
    <div class="form-control mb-4">
        <label class="label"><span class="label-text font-mono text-xs tracking-widest uppercase text-base-content/60">Confirm Password</span></label>
        <input type="password" name="confirm_password"
               class="input input-bordered bg-base-200 font-mono text-sm focus:border-primary focus:outline-none"
               required minlength="8">
    </div>
    <button type="submit" class="btn btn-primary w-full font-mono">Complete Setup</button>
</form>
{% endblock %}

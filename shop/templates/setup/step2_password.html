{% extends "setup/wizard_layout.html" %}
{% block step_content %}
<h2 class="text-xl font-bold font-mono mb-4">Step 2: Set Admin Password</h2>
<p class="text-sm text-base-content/70 font-mono mb-4">The default password must be changed before proceeding.</p>

<form method="post" action="/setup/step2">
    <div class="form-control mb-3">
        <label class="label"><span class="label-text font-mono text-xs tracking-widest uppercase text-base-content/60">New Password</span></label>
        <input type="password" name="new_password"
               class="input input-bordered bg-base-200 font-mono text-sm focus:border-primary focus:outline-none"
               required minlength="8">
    </div>
    <div class="flex items-center gap-3 mb-4">
        <label class="font-mono text-xs tracking-widest uppercase text-base-content/60 whitespace-nowrap">Confirm Password</label>
        <input type="password" name="confirm_password"
               class="input input-bordered bg-base-200 font-mono text-sm focus:border-primary focus:outline-none flex-1"
               required minlength="8">
    </div>
    <button type="submit" class="btn btn-primary w-full font-mono">Complete Setup</button>
</form>
{% endblock %}

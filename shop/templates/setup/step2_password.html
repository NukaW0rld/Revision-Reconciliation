{% extends "setup/wizard_layout.html" %}
{% block step_content %}
<h2 class="text-xl font-bold mb-4">Step 2: Set Admin Password</h2>
<p class="text-sm text-base-content/70 mb-4">The default password must be changed before proceeding.</p>
{% if admin_email %}
<div class="alert alert-info mb-4 text-sm">
  <span>Admin login email: <strong>{{ admin_email }}</strong> — save this, you'll need it to log in.</span>
</div>
{% endif %}
<form method="post" action="/setup/step2">
    <div class="form-control mb-3">
        <label class="label"><span class="label-text">New Password</span></label>
        <input type="password" name="new_password" class="input input-bordered" required minlength="8">
    </div>
    <div class="form-control mb-4">
        <label class="label"><span class="label-text">Confirm Password</span></label>
        <input type="password" name="confirm_password" class="input input-bordered" required minlength="8">
    </div>
    <button type="submit" class="btn btn-primary w-full">Complete Setup</button>
</form>
{% endblock %}

{% extends "setup/wizard_layout.html" %}
{% block step_content %}
<h2 class="text-xl font-bold font-mono mb-4">Step 1: Shop Name</h2>
<form method="post" action="/setup/step1">
    <div class="form-control mb-4">
        <label class="label"><span class="label-text font-mono text-xs tracking-widest uppercase text-base-content/60">Shop Name</span></label>
        <input type="text" name="shop_name"
               class="input input-bordered bg-base-200 font-mono text-sm focus:border-primary focus:outline-none"
               value="{{ config.shop_name or '' }}" required placeholder="e.g. Acme Quality Lab">
    </div>
    <button type="submit" class="btn btn-primary w-full font-mono">Continue</button>
</form>
{% endblock %}
